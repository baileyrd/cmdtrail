[package]
name = "cmdtrail"
version = "0.1.0"
edition = "2021"
description = "Per-directory command history capture and suggestion"

[lib]
name = "cmdtrail"
path = "src/lib.rs"

[[bin]]
name = "cmdtrail"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
anyhow = "1"
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
